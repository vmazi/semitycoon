# Semi Tycoon static site. No build step: files are bind-mounted straight from
# the repo, so an edit is live on reload. Caching is off for the same reason.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ $uri.html =404;
    }
}
