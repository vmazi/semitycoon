# Semi Tycoon static site. No build step: files are bind-mounted straight from
# the repo, so an edit is live on reload. Caching is off for the same reason.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;

    # the root IS the game, served in place rather than redirected, so that the
    # relative links in it still resolve to /design/, /mockups/ and /about/
    location = / {
        add_header Cache-Control "no-store";
        try_files /demo/index.html =404;
    }

    # Stock mime.types has no .webmanifest entry and Chrome refuses a manifest
    # sent as octet-stream. Set it on the one location rather than with a `types`
    # block: that block would *replace* the inherited map, not extend it, and
    # mime.types cannot be included back in because it is itself a types block.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store";
    }

    # The art is immutable in practice and link-preview crawlers re-fetch the
    # og image constantly, so icons are the one thing worth caching.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Must not be cached, or a stale worker keeps serving an old caching policy
    # long after this file changes.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Telemetry, proxied under the site's own origin so the game needs no CORS
    # preflight and a beacon can fire during page teardown.
    location /api/ {
        proxy_pass http://semitycoon-api:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 128k;
        # The sink must never hold up the game, so fail fast and let the
        # client's fire-and-forget send drop it on the floor.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ $uri.html =404;
    }
}
