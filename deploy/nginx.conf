# Semi Tycoon static site. No build step: files are bind-mounted straight from
# the repo, so an edit is live on reload. Caching is off for the same reason.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;

    # the root IS the game, served in place rather than redirected, so that the
    # relative links in it still resolve to /design/, /mockups/ and /about/
    location = / {
        add_header Cache-Control "no-store";
        try_files /demo/index.html =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ $uri.html =404;
    }
}
